{% extends "base.html" %}
{% block body %}
<h2>Edit Movie Project</h2>
<div style="max-width: 500px; margin-top: 20px;">
    <fieldset>
        <legend>Update Metadata</legend>
        <form method="post" action="{{ url_for('edit_movie', movie_id=movie.Id) }}">
            <label style="color: #bbb; font-size: 0.9em; text-transform: uppercase;">Title</label>
            <input name="title" value="{{movie.Title}}" required>
            <label style="color: #bbb; font-size: 0.9em; text-transform: uppercase;">Genre</label>
            <input name="genre" value="{{movie.Genre}}" required>
            <label style="color: #bbb; font-size: 0.9em; text-transform: uppercase;">Studio</label>
            <input name="studio" value="{{movie.StudioName or ''}}">
            <button style="margin-bottom: 15px;">Save Changes</button> 
            <a href="{{ url_for('index') }}" style="display: block; text-align: center; color: #888;">Cancel</a>
        </form>
    </fieldset>
</div>
{% endblock %}
