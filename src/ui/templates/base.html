<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ProduCast | Casting Network</title>
    <style>
        :root { --bg: #141414; --panel: #242424; --text: #e5e5e5; --accent: #e50914; --gold: #f5c518; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); max-width: 1300px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 30px; }
        h2 { color: #fff; margin-top: 2.5rem; font-weight: 400; border-left: 4px solid var(--accent); padding-left: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        fieldset { background: var(--panel); border: 1px solid #333; border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        legend { background: var(--gold); color: #000; padding: 5px 15px; border-radius: 4px; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; background: #333; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--gold); }
        button { background: var(--accent); color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #b20710; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--panel); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #111; color: var(--gold); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        tr:hover { background: #2a2a2a; }
        .flash { padding: 12px 15px; border-radius: 4px; margin-bottom: 1.5rem; font-weight: bold; }
        .ok { background: rgba(46, 204, 113, 0.15); border-left: 4px solid #2ecc71; color: #2ecc71; }
        .error { background: rgba(231, 76, 60, 0.15); border-left: 4px solid #e74c3c; color: #e74c3c; }
        a { color: var(--gold); text-decoration: none; font-weight: bold;}
        a:hover { text-decoration: underline; }
        .inline { display: inline; margin: 0; }
        .inline button { width: auto; padding: 6px 12px; font-size: 0.85rem; margin: 0; }
        .search-bar { display: flex; gap: 15px; background: var(--panel); padding: 1.5rem; border-radius: 8px; align-items: flex-start; }
        .search-bar input { margin: 0; }
        .search-bar button { width: auto; padding: 10px 25px; margin: 0;}
        .search-bar a { display: flex; align-items: center; padding: 0 15px; color: #888; }
        .badge { background: #444; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>
    <h1>🎬 ProduCast: Talent &amp; Production Network</h1>
    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, m in msgs %}
            <div class="flash {{cat}}">{{m}}</div>
        {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
</body>
</html>
