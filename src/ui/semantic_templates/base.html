<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ProduCast{% endblock %} · Cinema, connected.</title><link rel="icon" href="/static/logo.svg"><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="nav"><a class="brand" href="/"><img src="/static/logo.svg" alt=""><span>Produ<span>Cast</span><small>CINEMA, CONNECTED.</small></span></a><nav aria-label="Main navigation"><a class="{{ 'active' if active=='home' }}" href="/">Overview</a>{% for k,v in kinds.items() %}<a class="{{ 'active' if active==k }}" href="/{{k}}">{{v[1]}}</a>{% endfor %}<a class="{{ 'active' if active=='explore' }}" href="/explore">Collaborations</a></nav></div></header>
<main>{% if message %}<div class="notice" role="status">{{message}}</div>{% endif %}{% if error %}<div class="notice error" role="alert">{{error}}</div>{% endif %}{% block body %}{% endblock %}</main><footer><span>ProduCast · Cinema, connected.</span><span>Selected film catalogue</span><span><a href="/queries">Research tools</a> · <a href="/export.rdf">Data export</a></span></footer></body></html>
